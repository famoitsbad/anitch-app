<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>

  <!-- PWA Theme -->
  <meta name="theme-color" content="#004B39"/>
  <meta name="background-color" content="#004B39"/>

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Anitch"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

  <!-- iOS Splash Screens -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="application-name" content="Anitch"/>

  <!-- SEO & Social -->
  <meta name="description" content="Anitch Eczema Diary — Track your eczema, discover triggers, and reclaim healthy skin. 擺脫濕疹困擾。"/>
  <meta name="keywords" content="eczema, diary, skin, tracker, 濕疹, 日記"/>
  <meta property="og:title" content="Anitch — Eczema Diary"/>
  <meta property="og:description" content="Your personal eczema companion. Track, understand, heal."/>
  <meta property="og:image" content="/icon-512.png"/>
  <meta property="og:type" content="website"/>
  <meta name="twitter:card" content="summary"/>

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
  <link rel="manifest" href="/manifest.json"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>

  <title>Anitch — Eczema Diary | 濕疹日記</title>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #004B39;
      font-family: 'Lato', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    #root { min-height: 100vh; min-height: -webkit-fill-available; }
    /* iOS safe area support */
    #root { padding-bottom: env(safe-area-inset-bottom); }
    /* Ensure status bar never overlaps content on any device */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --header-top: max(16px, calc(env(safe-area-inset-top, 0px) + 16px));
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
